version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: authdb
    ports:
     - "5433:5432"
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d authdb"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - backend_net

  authservice:
    build:
      context: ./AuthService
    ports:
      - "5001:80"
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__AuthDbConnection=Host=postgres;Port=5432;Username=user;Password=pass;Database=authdb
      - JWT__Secret=AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyAhIg==
      - JWT__Issuer=YourApp
      - JWT__Audience=YourApp
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend_net


  llmgatewayservice:
    build:
      context: .
      dockerfile: LLMGatewayService/Dockerfile
    ports:
      - "5002:80"
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Development
      - JWT__Secret=AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyAhIg==
      - JWT__Issuer=YourApp
      - JWT__Audience=YourApp
      - LLM__Endpoint=http://llm-mock:8000/generate
    depends_on:
      - rabbitmq
    networks:
      - backend_net

  # Мок-сервис LLM
  llm-mock:
    image: python:3.10-slim
    command: >
      sh -c "pip install flask && python -m flask --app /app/llm.py run --host=0.0.0.0 --port=8000"
    volumes:
      - ./llm-mock:/app
    networks:
      - backend_net
    ports:
      - "8000:8000"
networks:
  backend_net:
    driver: bridge
